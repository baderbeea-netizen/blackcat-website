<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>منجا كسوف المختارين – black Cat</title>
<meta name="description" content="اقرأ منجا كسوف المختارين المجلد الأول مجاناً: 8 فصول بالعربي من سلسلة ECLIPSE OF THE CHOSEN من استوديو black Cat.">
<link rel="canonical" href="https://watch.dokesh.store/manga.html">
<meta property="og:image" content="https://watch.dokesh.store/media/manga/ecl_cover.jpg">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap">
<style>
/* Layout: a dark reading room; pages turn right-to-left, spreads on wide screens, one page on phones */
:root{
  --ink:#0e0c10; --panel:#1a171d; --line:#2c2830; --paper:#f4f1ec;
  --gold:#ecbe5a; --muted:#a39ba8;
  --f-display:"Tajawal","Segoe UI",Tahoma,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--f-display);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;direction:rtl}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:12px 8px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-size:28px;font-weight:900;color:var(--gold)}
.back{font-size:14px;font-weight:700;color:var(--paper);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;align-self:center}.back:hover{border-color:var(--gold)}
.brand span{font-size:14px;color:var(--muted);direction:ltr}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{font:inherit;font-size:14px;font-weight:700;background:var(--panel);color:var(--paper);
  border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
nav button[aria-current="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold)}
nav button:focus-visible,.turn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:4px;position:relative;padding-block:6px}
.stage img{max-height:100%;max-width:100%;height:auto;object-fit:contain;background:var(--paper);
  box-shadow:0 10px 40px rgb(0 0 0 / .55);user-select:none;-webkit-user-drag:none}
.spread img{max-width:calc(50% - 2px)}
.turn{position:absolute;top:0;bottom:0;width:22%;background:none;border:0;cursor:pointer;color:transparent}
.turn.next{left:0}.turn.prev{right:0}
footer{display:flex;align-items:center;justify-content:center;gap:14px;padding-block:8px 14px;color:var(--muted);font-size:14px}
footer button{font:inherit;font-weight:700;background:var(--panel);color:var(--paper);border:1px solid var(--line);
  border-radius:8px;padding:8px 16px;cursor:pointer}
footer button:disabled{opacity:.35;cursor:default}
#pos{font-variant-numeric:tabular-nums;min-width:90px;text-align:center}
.hint{font-size:12px;color:var(--muted)}
@media (max-width:820px){.spread img{max-width:100%}.hint{display:none}}
</style>

</head><body>
<header>
  <div class="brand"><a class="back" href="index.html">→ black Cat</a><b>كسوف المختارين</b><span>ECLIPSE OF THE CHOSEN · Vol. 1</span></div>
  <nav id="chapters" aria-label="الفصول"></nav>
</header>
<main class="stage" id="stage">
  <img id="a" alt="">
  <img id="b" alt="">
  <button class="turn prev" id="tprev" aria-label="الصفحة السابقة">السابق</button>
  <button class="turn next" id="tnext" aria-label="الصفحة التالية">التالي</button>
</main>
<footer>
  <button id="prev">→ السابق</button>
  <span id="pos"></span>
  <button id="next">التالي ←</button>
  <span class="hint">الأسهم أو اسحب للتقليب</span>
</footer>

<script>
const N=34;
const pages=[...Array(N)].map((_,i)=>'media/manga/ecl/'+String(i).padStart(2,'0')+'.jpg');
const chapters=[["الغلاف",0],["1",1],["2",5],["3",9],["4",13],["5",17],["6",21],["7",25],["8",29]];
let i=0;
try{const s=parseInt(localStorage.getItem('bc_ecl_page'));if(s>=0&&s<N)i=s}catch(e){}
const $=id=>document.getElementById(id);
const wide=()=>matchMedia('(min-width:821px)').matches;
const nav=$('chapters');
chapters.forEach(([n,p])=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>go(p);b.dataset.p=p;nav.appendChild(b)});
function step(){return wide()&&i>0?2:1}
function go(n){
  if(wide()&&n>0&&n%2===0)n-=1;          // spreads start on odd pages (cover alone)
  i=Math.max(0,Math.min(N-1,n));render();
}
function render(){
  const two=wide()&&i>0&&i+1<N;
  $('stage').classList.toggle('spread',two);
  $('a').src=pages[i];$('a').alt='صفحة '+(i+1);
  $('b').hidden=!two; if(two){$('b').src=pages[i+1];$('b').alt='صفحة '+(i+2)}
  $('pos').textContent=two?`${i+1}–${i+2} / ${N}`:`${i+1} / ${N}`;
  $('prev').disabled=i===0;$('next').disabled=i+(two?2:1)>=N;
  let cur=0;chapters.forEach(([,p],k)=>{if(i+(two?1:0)>=p)cur=k});
  [...nav.children].forEach((b,k)=>b.setAttribute('aria-current',k===cur));
  try{localStorage.setItem('bc_ecl_page',i)}catch(e){}
  [i+2,i+3].forEach(k=>{if(k<N){const im=new Image();im.src=pages[k]}});
}
const next=()=>{if(i===0)go(1);else go(i+step())};
const prev=()=>{if(wide()&&i<=1)go(0);else go(i-step())};
$('next').onclick=next;$('prev').onclick=prev;$('tnext').onclick=next;$('tprev').onclick=prev;
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')next();if(e.key==='ArrowRight')prev()});
let x0=null;$('stage').addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
$('stage').addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;
  if(Math.abs(dx)>50){dx>0?next():prev()}x0=null});
addEventListener('resize',()=>go(i));
go(i);
</script>

</body></html>
