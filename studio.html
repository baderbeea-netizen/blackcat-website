<style>
/* Layout: an editing bay — media library | stage | inspector, timeline docked underneath.
   One committed look: warm studio black, kintsugi gold as the only accent. Bilingual: RTL Arabic / LTR English. */
:root{
  --ink:#0c0b0a; --panel:#141210; --raise:#1d1a16; --line:#2c2722; --line-hi:#3d362e;
  --fg:#ece5d8; --muted:#978d7f; --gold:#d6a94a; --gold-hi:#f2d283; --gold-ink:#1a1305;
  --danger:#e0705f; --text-trk:#4a6b8a; --music-trk:#5e7a52;
  --f-display:'Reem Kufi','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --f-brand:'Fredoka','Varela Round',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{display:flex;align-items:center;gap:16px;padding-block:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px}
.brand img{height:40px;width:auto;display:block}
.brand b{font-family:var(--f-brand);font-size:22px;font-weight:600;line-height:1.1;color:var(--fg)}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.02em}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.tab{background:none;border:0;padding:6px 14px;border-radius:7px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px}
.tab svg{width:16px;height:16px}
.tab[aria-selected="true"]{background:var(--raise);color:var(--gold-hi);box-shadow:inset 0 0 0 1px var(--line-hi)}
.top .spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-hi);background:var(--raise);border-radius:8px;padding:7px 14px;font-weight:600}
.btn:hover{border-color:var(--gold)}
.btn svg{width:16px;height:16px}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.gold:hover{background:var(--gold-hi)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}
.langbtn{font-family:var(--f-body);min-width:86px}
.langbtn svg{color:var(--gold)}
.ibtn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:7px;border:1px solid transparent;background:none;color:var(--fg)}
.ibtn:hover{background:var(--raise);border-color:var(--line-hi)}
.ibtn svg{width:18px;height:18px}
.ibtn:disabled{opacity:.35}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.view{min-height:0}

/* editor grid */
.editor{display:grid;grid-template-columns:minmax(230px,270px) minmax(0,1fr) minmax(250px,300px);grid-template-rows:minmax(0,1fr) auto;gap:12px;padding-block:12px;height:100%}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:0;overflow:auto}
.panel h3{font-family:var(--f-display);font-weight:500;font-size:15px;margin:0;color:var(--gold-hi)}
.sec{padding:14px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.sec:last-child{border-bottom:0}
.lbl{font-size:11.5px;color:var(--muted);letter-spacing:.03em;font-weight:500}
.hint{font-size:12px;color:var(--muted);margin:0}

/* library */
.drop{border:1.5px dashed var(--line-hi);border-radius:10px;padding:14px;text-align:center;display:grid;gap:6px;justify-items:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--gold);background:rgba(214,169,74,.06)}
.drop svg{width:22px;height:22px;color:var(--gold)}
.drop b{font-weight:600}
.mlist{display:grid;gap:8px}
.mitem{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--raise);border:1px solid var(--line);border-radius:9px;padding:6px}
.mthumb{width:54px;height:40px;border-radius:6px;background:#000 center/cover no-repeat;display:grid;place-items:center;color:var(--gold)}
.mthumb svg{width:18px;height:18px}
.mmeta{min-width:0}
.mmeta b{display:block;font-weight:500;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mmeta small{color:var(--muted);font-family:var(--f-mono);font-size:10.5px}
.scenes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.scene{border:1px solid var(--line);border-radius:8px;padding:0;background:#000;overflow:hidden;display:grid}
.scene img{width:100%;aspect-ratio:9/14;object-fit:cover;display:block}
.scene span{font-size:10.5px;padding:3px 2px;background:var(--raise);color:var(--muted)}
.scene:hover{border-color:var(--gold)}
.tpls{display:flex;flex-wrap:wrap;gap:6px}
.tpl{border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:4px 10px;font-size:12px}
.tpl:hover{border-color:var(--gold);color:var(--gold-hi)}
.caplive{border:1px dashed var(--gold);border-radius:8px;padding:8px 10px;min-height:40px;font-size:13px;color:var(--gold-hi);background:rgba(214,169,74,.05)}
.caplive small{display:block;color:var(--muted);font-size:11px}
.btn.rec{background:var(--danger);border-color:var(--danger);color:#1a0705}
.btn.rec::before{content:"";width:8px;height:8px;border-radius:50%;background:#1a0705;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.capcount{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}

/* stage */
.stagecol{display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;min-height:0}
.stagebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:11.5px;border:1px solid var(--line-hi);border-radius:999px;padding:2px 10px;color:var(--muted)}
.pill.demo{border-color:rgba(214,169,74,.5);color:var(--gold-hi)}
.linkbtn{background:none;border:0;color:var(--gold);text-decoration:underline;text-underline-offset:3px;padding:0;font-size:12px}
.stage{background:#050505 radial-gradient(circle at 50% 40%,#16130f,#050505 70%);border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;min-height:0;padding:12px;overflow:hidden}
#stage{max-width:100%;max-height:100%;border-radius:4px;box-shadow:0 10px 40px rgba(0,0,0,.6);background:#000;touch-action:none}

/* timeline (always left-to-right, like time) */
.tl{grid-column:1/-1;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.transport{display:flex;align-items:center;gap:4px;padding:6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.playbtn{width:38px;height:38px;border-radius:50%;background:var(--gold);color:var(--gold-ink);border:0;display:grid;place-items:center}
.playbtn svg{width:18px;height:18px}
.tc{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;padding:0 10px;direction:ltr;color:var(--fg)}
.tc span{color:var(--muted)}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.tlbody{display:flex;direction:ltr}
.tlabels{flex:0 0 40px;border-right:1px solid var(--line);background:var(--panel)}
.tlabels div{display:grid;place-items:center;color:var(--muted)}
.tlabels svg{width:16px;height:16px}
.tlscroll{flex:1;overflow-x:auto;overflow-y:hidden;position:relative;min-width:0}
.tlinner{position:relative;min-width:100%;user-select:none;-webkit-user-select:none}
.ruler{height:22px;position:relative;border-bottom:1px solid var(--line);cursor:ew-resize}
.tick{position:absolute;top:0;height:100%;border-left:1px solid var(--line-hi);font-family:var(--f-mono);font-size:9.5px;color:var(--muted);padding-left:3px;line-height:20px}
.track{position:relative;border-bottom:1px solid var(--line)}
.tr-v{height:58px}.tr-t,.tr-m{height:34px}
.blk{position:absolute;top:4px;bottom:4px;border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.12);cursor:grab;display:flex;align-items:flex-end;touch-action:none}
.blk.clip{background:#222 left/auto 100% repeat-x}
.blk.txt{background:var(--text-trk)}
.blk.mus{background:var(--music-trk)}
.blk.endblk{background:repeating-linear-gradient(135deg,#1b1813 0 6px,#221e18 6px 12px);cursor:default;align-items:center;justify-content:center;color:var(--gold);font-size:11px;font-family:var(--f-display)}
.blk.sel{border:2px solid var(--gold-hi);box-shadow:0 0 0 1px #000}
.blk .bl{font-size:10.5px;background:rgba(0,0,0,.6);padding:1px 6px;border-radius:0 4px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;unicode-bidi:plaintext;pointer-events:none}
.blk.txt .bl,.blk.mus .bl{background:none;align-self:center;font-size:11.5px;padding:0 10px}
.h{position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize;z-index:2}
.h-l{left:0}.h-r{right:0}
.blk.sel .h{background:var(--gold-hi)}
.blk.sel .h::after{content:"";position:absolute;top:35%;bottom:35%;left:3px;width:1.5px;background:var(--gold-ink)}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--gold-hi);pointer-events:none;z-index:5;margin-left:-1px}
.playhead::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top:8px solid var(--gold-hi)}

/* inspector controls */
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line-hi);background:var(--raise);border-radius:7px;padding:4px 9px;font-size:12px}
.chip:hover{border-color:var(--gold)}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:600}
.chip .sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:5px;vertical-align:-1px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px}
.row output{font-family:var(--f-mono);font-size:11px;color:var(--muted);min-width:42px;text-align:end;direction:ltr}
input[type=range]{width:100%;accent-color:var(--gold)}
textarea,input[type=text],select{width:100%;background:var(--raise);border:1px solid var(--line-hi);border-radius:8px;padding:8px 10px}
textarea{resize:vertical;min-height:70px}
.check{display:flex;align-items:center;gap:8px}
.check input{accent-color:var(--gold);width:16px;height:16px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat b{display:block;font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums;unicode-bidi:isolate;direction:ltr;text-align:right}
[dir="ltr"] .stat b{text-align:left}
.stat small{color:var(--muted);font-size:11px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mbox{background:var(--panel);border:1px solid var(--line-hi);border-radius:14px;width:min(460px,100%);max-height:100%;overflow:auto;padding:20px;display:grid;gap:14px}
.mbox h2{font-family:var(--f-display);font-weight:700;margin:0;font-size:20px;color:var(--gold-hi)}
.bar{height:8px;background:var(--raise);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold-hi));transition:width .2s}
.result video,.result img,.result audio{width:100%;max-height:300px;border-radius:8px;background:#000;display:block}
.meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);unicode-bidi:plaintext}

/* converter */
.scrollview{height:100%;overflow:auto;padding-block:20px}
.narrow{max-width:880px;margin:0 auto;display:grid;gap:18px}
.vhead h2{font-family:var(--f-display);font-size:28px;margin:0;color:var(--gold-hi);font-weight:700;text-wrap:balance}
.vhead p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.bigdrop{padding:34px 16px}
.bigdrop svg{width:34px;height:34px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:14px}
.card h3{margin:0;font-family:var(--f-display);font-weight:500;color:var(--gold-hi)}
.fileinfo{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.fileinfo b{font-weight:600;word-break:break-all}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.opt{display:grid;gap:5px}
.tablewrap{overflow-x:auto}
table.conv{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
.conv th,.conv td{text-align:start;padding:8px 10px;border-bottom:1px solid var(--line)}
.conv th{color:var(--muted);font-weight:500;font-size:12px}
.conv td code{font-family:var(--f-mono);font-size:11.5px;color:var(--gold-hi);background:var(--raise);padding:1px 6px;border-radius:4px}

/* ideas */
.ideas{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:16px;max-width:1180px;margin:0 auto;align-items:start}
.idea-out{display:grid;gap:12px;min-width:0}
.idea-title{font-family:var(--f-display);font-size:24px;margin:0;color:var(--gold-hi);text-wrap:balance}
.hooks{display:grid;gap:6px}
.hook{display:flex;gap:10px;align-items:center;background:var(--raise);border:1px solid var(--line);border-radius:9px;padding:9px 12px;cursor:pointer}
.hook input{accent-color:var(--gold)}
.hook:has(input:checked){border-color:var(--gold)}
.beats{display:grid;gap:8px}
.beat{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:10px;align-items:start}
.beat .bt{font-family:var(--f-mono);font-size:12px;color:var(--gold-hi);direction:ltr;text-align:center;border:1px solid var(--line-hi);border-radius:6px;padding:4px 0}
.beat h4{margin:0 0 2px;font-size:14px;font-weight:600}
.beat p{margin:0;font-size:13px;color:var(--muted)}
.beat .cam{color:var(--fg)}
.beat .ost{margin-top:4px;color:var(--gold-hi);font-family:var(--f-display)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:2px 10px;unicode-bidi:plaintext}
.status{font-size:12.5px;color:var(--muted);min-height:1.5em;margin:0}

.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--raise);border:1px solid var(--gold);color:var(--fg);padding:9px 16px;border-radius:9px;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.5);font-size:13px;max-width:calc(100% - 32px)}

@media (max-width:1099px){
  html,body{height:auto}
  .app{height:auto;min-height:100%}
  .editor{grid-template-columns:minmax(0,1fr);grid-template-rows:none;height:auto}
  .stagecol{order:1}
  .tl{order:2}
  .inspector{order:3}
  .library{order:4}
  .stage{height:min(62vh,640px)}
  .panel{overflow:visible}
  .scrollview{height:auto;overflow:visible}
  .ideas{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:620px){
  .tab span{display:none}
  .tab{padding:6px 10px}
  .brand small{display:none}
  .top .spacer{display:none}
  .langbtn{min-width:0}
  .vhead h2{font-size:23px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<div class="app" id="app" dir="rtl">
  <header class="top">
    <a class="brand" href="./" style="color:inherit;text-decoration:none" aria-label="black Cat">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M7 5l7 9a14 14 0 0 1 12 0l7-9 1 15a14 14 0 0 1-28 0z" fill="#000" stroke="#d6a94a" stroke-width="1.6" stroke-linejoin="round"/><ellipse cx="14.5" cy="22" rx="2.8" ry="1.7" fill="#f2d283"/><ellipse cx="25.5" cy="22" rx="2.8" ry="1.7" fill="#f2d283"/><path d="M17 29q3 2 6 0" stroke="#d6a94a" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>
      <img id="brandLogo" alt="black Cat" hidden>
      <div><b>black Cat</b><small data-t="brandSub"></small></div>
    </a>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="edit" aria-selected="true"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg><span data-t="tabEdit"></span></button>
      <button class="tab" role="tab" data-view="convert" aria-selected="false"><svg class="i" viewBox="0 0 24 24"><path d="M4 8h13l-4-4M20 16H7l4 4"/></svg><span data-t="tabConvert"></span></button>
      <button class="tab" role="tab" data-view="ideas" aria-selected="false"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 17l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg><span data-t="tabIdeas"></span></button>
    </nav>
    <div class="spacer"></div>
    <button class="btn langbtn" id="langBtn"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span id="langLbl"></span></button>
    <button class="btn gold" id="exportBtn"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></svg><span data-t="export"></span></button>
  </header>

  <!-- ============ EDITOR ============ -->
  <main class="view" id="view-edit">
    <div class="editor">
      <aside class="panel library" id="library">
        <div class="sec">
          <h3 data-t="libTitle"></h3>
          <label class="drop" id="libDrop">
            <input type="file" id="libFile" accept="video/*,image/*,audio/*" multiple hidden>
            <svg class="i" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>
            <b data-t="libImport"></b>
            <span class="hint" data-t="libImportHint"></span>
          </label>
          <div class="mlist" id="mlist"></div>
        </div>
        <div class="sec" id="capSec">

tlInner.addEventListener('pointerdown', e => {
  if (exportJob) return;
  const rect = tlInner.getBoundingClientRect();
  const blk = e.target.closest('.blk[data-id]');
  if (!blk) {
    const wasSel = sel; sel = null; seekTo((e.clientX - rect.left) / pps);
    if (wasSel) { renderTimeline(); renderInspector(); }
    const mv = ev => seekTo((ev.clientX - rect.left) / pps);
    window.addEventListener('pointermove', mv);
    window.addEventListener('pointerup', () => window.removeEventListener('pointermove', mv), { once: true });
    return;
  }
  e.preventDefault();
  const type = blk.dataset.type, id = blk.dataset.id, h = e.target.dataset.h;
  sel = { type, id };
  const obj = getObj(type, id); if (!obj) return;
  const pre = JSON.stringify(P), orig = { ...obj }, x0 = e.clientX;
  const startEntry = type === 'clip' ? layout().find(o => o.c.id === id) : null;
  let moved = false, dxS = 0;
  renderTimeline(); renderInspector();
  const onMove = ev => {
    if (!moved && Math.abs(ev.clientX - x0) < 4) return;
    moved = true; dxS = (ev.clientX - x0) / pps;
    applyDrag(type, obj, orig, h, dxS);
    if (type === 'clip' && !h) { const el = tlInner.querySelector(`.blk[data-id="${id}"]`); if (el) { el.style.transform = `translateX(${dxS * pps}px)`; el.style.zIndex = 4; el.style.opacity = .85; } }
    else { renderTimeline(); needsDraw = true; }
  };
  const onUp = () => {
    window.removeEventListener('pointermove', onMove);
    if (moved && type === 'clip' && !h && startEntry) {
      const center = startEntry.start + dxS + (startEntry.end - startEntry.start) / 2;
      const others = P.clips.filter(c => c !== obj); let s = 0, idx = others.length;
      for (let i = 0; i < others.length; i++) { const l = clipLen(others[i]); if (center < s + l / 2) { idx = i; break; } s += l; }
      others.splice(idx, 0, obj); P.clips = others;
    }

});
function applyDrag(type, o, orig, h, dx) {
  if (type === 'clip') {
    if (!h) return;
    if (o.kind === 'video') {
      const md = media[o.mediaId].duration;
      if (h === 'l') o.in = +clamp(orig.in + dx * orig.speed, 0, orig.out - 0.1).toFixed(3);
      else o.out = +clamp(orig.out + dx * orig.speed, orig.in + 0.1, md).toFixed(3);
    } else {
      o.dur = +clamp(orig.dur + (h === 'l' ? -dx : dx), 0.5, 60).toFixed(2);
    }
  } else if (type === 'text') {
    const len = orig.end - orig.start;
    if (!h) { o.start = +Math.max(0, orig.start + dx).toFixed(2); o.end = +(o.start + len).toFixed(2); }
    else if (h === 'l') o.start = +clamp(orig.start + dx, 0, orig.end - 0.2).toFixed(2);
    else o.end = +Math.max(orig.start + 0.2, orig.end + dx).toFixed(2);
  } else if (type === 'music') {
    const md = media[o.mediaId].duration;

    else if (h === 'l') { const ni = clamp(orig.in + dx, 0, orig.in + orig.len - 0.5); const d = ni - orig.in; o.in = +ni.toFixed(2); o.len = +(orig.len - d).toFixed(2); o.offset = +Math.max(0, orig.offset + d).toFixed(2); }

  setCapButton(cap.state); renderCapHint();
  renderScenesTpls(); renderLibrary(); renderIdeaChips(); updatePlayBtn();
  if (currentNote === 'noteExample' || !currentIdea) renderIdea(localIdea(topic.value, ideaState.type, ideaState.mood, ideaState.dur), 'noteExample');
  else renderIdea(currentIdea, currentNote);
  if (SAMPLE && $('#ideaStatus').textContent) $('#ideaStatus').textContent = t('aiConnected');
  if (!$('#exportModal').hidden && !exportJob) { if (exportView === 'result') renderExportResult(); else renderExportSetup(); }
  if (convFile && $('#convRun').hidden && !$('#convPanel').hidden) openConv(convFile);
  if (convLast && !$('#convResult').hidden) renderConvResult();
  refresh();
}
$('#langBtn').addEventListener('click', () => {
  LANG = LANG === 'en' ? 'ar' : 'en';
  try { localStorage.setItem('bc_lang', LANG); } catch (e) {}
  if (P.sample && hist.length === 0) P = sampleProject();
  applyLang();
});

/* ================= boot ================= */
applyLang();
showView((location.hash || '#edit').slice(1));
new ResizeObserver(() => renderTimeline()).observe(tlScroll);
if (document.fonts) Promise.all(["700 40px 'Reem Kufi'", "40px Lalezar", "600 40px Fredoka", "600 40px 'IBM Plex Sans Arabic'"].map(f => document.fonts.load(f).catch(() => {}))).then(() => { needsDraw = true; });
requestAnimationFrame(loop);
if (window.claude && claude.use) {
  claude.use('downloads').then(d => { DL = d; }).catch(() => {});
  claude.use('sample').then(s => { SAMPLE = s; renderCapTools(); if (s) $('#ideaStatus').textContent = t('aiConnected'); }).catch(() => {});
  claude.use('dictation').then(setupDictation).catch(() => setupDictation(null));
} else setupDictation(null);
</script>
